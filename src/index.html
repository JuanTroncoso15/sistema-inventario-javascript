<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Inventario</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container header-content">
        <div>
          <p class="eyebrow">Universidad</p>
          <h1>Sistema de Inventario Básico</h1>
        </div>
      </div>
    </header>

    <main class="container app-shell">
      <section class="card form-card">
        <div class="section-header">
          <h2>Registrar producto</h2>
        </div>

        <form id="product-form">
          <div class="grid-form">
            <label>
              <span>Nombre</span>
              <input id="product-name" name="nombre" type="text" maxlength="80" placeholder="Ej. Mouse USB" required />
            </label>

            <label>
              <span>Categoría</span>
              <input id="product-category" name="categoria" type="text" maxlength="50" placeholder="Ej. Tecnología" />
            </label>

            <label>
              <span>Precio</span>
              <input id="product-price" name="precio" type="number" min="0" step="0.01" placeholder="0.00" required />
            </label>

            <label>
              <span>Cantidad disponible</span>
              <input id="product-quantity" name="cantidad" type="number" min="0" step="1" placeholder="0" required />
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="primary-btn">Guardar producto</button>
            <button type="button" id="cancel-edit" class="secondary-btn hidden">Cancelar edición</button>
          </div>
        </form>
      </section>

      <section class="stats-grid" aria-label="Estadísticas del inventario">
        <article class="stat-card accent-blue">
          <p>Total de productos</p>
          <strong id="total-products">0</strong>
        </article>
        <article class="stat-card accent-gray">
          <p>Valor total</p>
          <strong id="inventory-value">$0.00</strong>
        </article>
        <article class="stat-card accent-warning">
          <p>Productos con pocas existencias</p>
          <strong id="low-stock-count">0</strong>
        </article>
      </section>

      <section class="card table-card">
        <div class="toolbar">
          <div>
            <h2>Productos registrados</h2>
          </div>
          <label class="search-box" aria-label="Buscar producto">
            <span>Buscar</span>
            <input id="search-input" type="search" placeholder="Buscar por nombre o categoría" />
          </label>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Fecha</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="./js/inventario.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
